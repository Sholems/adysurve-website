curriculum:
  heading: "CCTV installation and surveillance security curriculum."
  text: "Our training curriculum is carefully designed to cover both basic and advanced CCTV installation and surveillance concepts."
  modules:
    - - "Module 1: Introduction to CCTV & Security Systems"
      - ["Overview of surveillance technology", "Types of CCTV cameras", "Analog vs IP camera systems", "Understanding security system components", "CCTV industry opportunities"]
    - - "Module 2: CCTV Installation Fundamentals"
      - ["Site inspection and security assessment", "Camera positioning and coverage planning", "Cable types and cable management", "Power supply installation", "Installation safety procedures"]
    - - "Module 3: DVR, NVR & System Configuration"
      - ["DVR and NVR setup", "Camera configuration and integration", "Hard drive installation and storage management", "Recording settings and playback", "Remote viewing setup"]
    - - "Module 4: Networking for Surveillance Systems"
      - ["IP addressing for CCTV systems", "Wireless surveillance systems", "Router configuration", "Internet connectivity for remote monitoring", "Mobile app integration"]
    - - "Module 5: Surveillance Security & Monitoring"
      - ["Live monitoring techniques", "Motion detection setup", "Security alert systems", "Access control basics", "Data protection and surveillance best practices"]
    - - "Module 6: Maintenance & Troubleshooting"
      - ["Diagnosing common CCTV faults", "Camera maintenance", "Repair and replacement techniques", "System upgrades and optimization", "Troubleshooting network and recording issues"]
    - - "Module 7: Business & Professional Development"
      - ["Starting a CCTV installation business", "Customer service and project management", "Pricing and quotation preparation", "Professional communication", "Career opportunities in surveillance technology"]
