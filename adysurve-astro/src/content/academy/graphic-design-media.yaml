curriculum:
  heading: "Creative and digital communication skills for today&rsquo;s media-driven world."
  text: "Our 3-month Graphic Design & Media Communication program covers essential creative and digital communication skills needed in today&rsquo;s media-driven world."
  modules:
    - - "Module 1: Introduction to Graphic Design"
      - ["Principles of graphic design", "Understanding visual communication", "Color theory and typography", "Design layout and composition", "Branding fundamentals"]
    - - "Module 2: Graphic Design Software Training"
      - ["Introduction to professional design tools", "Creating flyers, posters, and banners", "Logo design techniques", "Social media graphic creation", "Image editing and enhancement"]
    - - "Module 3: Branding & Media Communication"
      - ["Brand identity development", "Visual storytelling", "Advertising and promotional design", "Corporate communication materials", "Designing for digital marketing"]
    - - "Module 4: Social Media & Content Design"
      - ["Designing content for Facebook, Instagram, TikTok, and YouTube", "Social media branding strategies", "Creating engaging digital content", "Content planning and presentation", "Media communication techniques"]
    - - "Module 5: Practical Creative Projects"
      - ["Real-world design assignments", "Business branding projects", "Portfolio development", "Presentation and client communication", "Creative workflow management"]
    - - "Module 6: Freelancing & Career Development"
      - ["Starting a graphic design business", "Freelancing opportunities", "Client management and pricing", "Building a professional portfolio", "Career opportunities in creative media"]
