    - "Small class sizes for better learning"
    - "Certificate of completion after training"
curriculum:
  heading: "A 6-month curriculum for networking, IT infrastructure, and cybersecurity."
  text: "Our 6-month program covers essential and advanced concepts in networking, IT infrastructure, and cybersecurity."
  modules:
    - - "Module 1: Computer & IT Fundamentals"
      - ["Introduction to Information Technology", "Computer hardware and software basics", "Operating systems fundamentals", "Internet and networking basics", "Troubleshooting computer systems"]
    - - "Module 2: Networking Fundamentals"
      - ["Network types and topologies", "IP addressing and subnetting", "Routers and switches configuration", "LAN and WAN setup", "Wireless networking", "Structured cabling systems"]
    - - "Module 3: IT Infrastructure & Support"
      - ["Server setup and administration", "System maintenance and upgrades", "IT support operations", "Backup and recovery systems", "Cloud and remote access basics"]
    - - "Module 4: Network Security & Cybersecurity"
      - ["Introduction to cybersecurity", "Firewall configuration", "Network protection techniques", "Threat detection and prevention", "Data security best practices", "Password and access management", "Security monitoring fundamentals"]
    - - "Module 5: Practical Installation & Configuration"
      - ["Network device installation", "CCTV and surveillance integration basics", "Real-world networking projects", "Office and enterprise network setup", "Troubleshooting live network issues"]
    - - "Module 6: Professional Development & Career Readiness"
      - ["IT career guidance", "CV and portfolio development", "Professional communication skills", "Freelancing and business opportunities in IT", "Interview preparation and workplace ethics"]
