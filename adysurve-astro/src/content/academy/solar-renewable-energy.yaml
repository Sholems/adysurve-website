curriculum:
  heading: "Solar renewable energy design and installation curriculum."
  text: "Our intensive 1-month training program covers the essential areas of solar renewable energy design and installation."
  modules:
    - - "Module 1: Introduction to Solar Renewable Energy"
      - ["Basics of renewable energy", "Understanding solar energy systems", "Types of solar power systems", "Components of a solar system", "Opportunities in the solar energy industry"]
    - - "Module 2: Solar Panel & System Design"
      - ["Solar panel sizing and selection", "Load assessment and energy calculation", "Battery sizing and configuration", "Inverter selection and installation", "Designing efficient solar systems"]
    - - "Module 3: Practical Solar Installation"
      - ["Solar panel mounting techniques", "Electrical wiring and connections", "Inverter and battery installation", "Charge controller setup", "Safety procedures during installation"]
    - - "Module 4: System Testing & Maintenance"
      - ["Solar system testing procedures", "Performance monitoring", "Fault detection and troubleshooting", "Battery maintenance", "Preventive maintenance practices"]
    - - "Module 5: Solar Business & Professional Development"
      - ["Starting a solar installation business", "Customer consultation and project planning", "Quotation and pricing preparation", "Professional ethics and customer service", "Career opportunities in renewable energy"]
