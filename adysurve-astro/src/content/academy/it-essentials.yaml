intro:
  - "Technology has become an essential part of everyday life and modern business operations. From communication and education to business management and digital services, computer knowledge and IT skills are now among the most valuable skills in today&rsquo;s world."
  - "At ADYSURVE LTD, we offer a comprehensive <strong class=\"text-white\">3-Month IT Essentials for Beginners Training Program</strong> designed to help students, job seekers, entrepreneurs, office workers, and beginners build a strong foundation in Information Technology."
  - "This training program is beginner-friendly and focuses on practical learning, helping participants develop the confidence and technical skills needed to use computers effectively, understand digital systems, and prepare for advanced technology careers."
  - "Whether you are completely new to computers or looking to improve your digital knowledge, our IT Essentials program provides the right starting point for success in today&rsquo;s digital economy."
why:
  label: "Why Choose ADYSURVE LTD IT Training?"
  heading: "Simple, practical, and accessible technology education."
  text: "At ADYSURVE LTD, we believe technology education should be simple, practical, and accessible to everyone. Our training is structured to make learning easy while providing hands-on experience with real computer systems and modern digital tools."
  items:
    - "Beginner-friendly learning environment"
    - "Hands-on practical computer sessions"
    - "Step-by-step teaching approach"
    - "Experienced IT instructors"
    - "Small class sizes for personalized attention"
    - "Real-world digital skills training"
    - "Practical assignments and projects"
    - "Career-focused learning structure"
    - "Certificate of completion awarded after training"
curriculum:
  heading: "Core digital and computer skills every beginner should know."
  text: "Our 3-month IT Essentials training covers the core digital and computer skills every beginner should know."
  modules:
    - - "Module 1: Introduction to Computers"
      - ["Understanding computer systems", "Types of computers and devices", "Computer hardware and software basics", "Input and output devices", "Computer operating systems"]
    - - "Module 2: Basic Computer Operations"
      - ["Using Windows operating system", "File and folder management", "Installing and uninstalling software", "Keyboard shortcuts and productivity tips", "Computer maintenance basics"]
    - - "Module 3: Internet & Digital Literacy"
      - ["Understanding the internet", "Web browsing and online research", "Email creation and management", "Online safety and cybersecurity awareness", "Digital communication tools"]
    - - "Module 4: Microsoft Office & Productivity Tools"
      - ["Microsoft Word for document creation", "Microsoft Excel basics", "Microsoft PowerPoint presentations", "Formatting and professional documentation", "Office productivity techniques"]
    - - "Module 5: Introduction to Networking & IT Support"
      - ["Basic networking concepts", "Understanding internet connectivity", "Troubleshooting common computer problems", "Basic IT support skills", "Introduction to computer security"]
    - - "Module 6: Digital Skills for Career & Business"
      - ["Online collaboration tools", "Digital workplace skills", "CV and professional document preparation", "Freelancing and online opportunities", "Career guidance in Information Technology"]
